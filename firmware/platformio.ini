; flowtick-meter -- ESP-IDF firmware, first for the Allmess EVK 3/110 +m
;
; Build: PlatformIO with framework = espidf.
;
; espressif32 7.0.1 ships ESP-IDF 6.0.1. (The PlatformIO package version
; "4.60001.0" encodes 6.00.01 -- that is NOT ESP-IDF 4.6.)
;
; Deliberately the official platform, not the pioarduino fork: that one follows
; the Arduino-ESP32 3.3.x cycle and stops at ESP-IDF 5.5.5. It also installs a
; different ESP-IDF into the same package directory
; ~/.platformio/packages/framework-espidf, so alternating builds of this and
; the sibling project overwrite each other's toolchain.
;
; Pinned to an exact version, never to a moving tag.

[platformio]
default_envs = supermini-c6

[env]
platform = espressif32@7.0.1
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Re-embeds the web interface before every build. Why a pre-build hook and not
; a CMake rule is explained in the script -- in short, the CMake variant
; silently served a stale page.
extra_scripts =
  pre:tools/gen_ui_asset.py

build_flags =
  -std=gnu++20
  -Wall
  -Wextra
  -Wno-unused-parameter
  ; Designated initialisers zero the remaining members in C++20, so this
  ; warning fires on exactly the pattern we use on purpose to survive ESP-IDF
  ; structs that gain fields between versions.
  -Wno-missing-field-initializers

build_unflags =
  -std=gnu++2b
  -std=gnu++17

;
; ESP32-C6 Super Mini
; ADC GPIO1, status LED GPIO15, BOOT GPIO9. See src/board.h.
;
[env:supermini-c6]
board = esp32-c6-devkitc-1
; The Super Mini carries 4 MB of flash; the devkit definition says 8 MB. Left
; at 8 MB, esptool writes that into the image header and the app asserts in
; flash init on every boot ("Detected size(4096k) smaller than ...").
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
